name: Lens Design System Enforcement

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  enforce-lens:
    name: 🛡️ Lens Compliance Guard
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: 🧠 Rebuild lint mastery DBs
      run: |
        pnpm generate:lint-dbs
        pnpm verify:lint-dbs

    - name: ✅ Ensure regenerated DBs are committed
      run: git diff --exit-code -- eslint-plugin-lens-compliance/lib/mastery-db.json eslint-plugin-lens-compliance/lib/component-mastery-db.json

    - name: 🔍 Run Lens Linter
      run: pnpm eslint 'src/**/*.{ts,tsx}' --max-warnings=0
